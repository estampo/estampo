name = "test-cube-petgcf"

[pipeline]
stages = ["load", "arrange", "plate", "slice"]

[plate]
size = [256, 256]
padding = 5.0

[slicer]
engine = "orca"
version = "2.3.1"
printer = "Bambu Lab P1S 0.4 nozzle"
process = "0.20mm Standard @BBL X1C"
filaments = ["Generic PETG-CF @BBL X1C"]
bed_type = "Textured PEI Plate"

[slicer.overrides]
sparse_infill_density = "25%"

[[parts]]
file = "tests/fixtures/cube_10mm.stl"
