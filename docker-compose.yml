services:
  estampo:
    build:
      context: .
      args:
        ORCA_VERSION: "2.3.1"
    image: estampo:orca-2.3.1
    platform: linux/amd64
    volumes:
      - .:/project
    working_dir: /project
    # UID/GID come from .env (copy .env.example → .env and set your IDs).
    # $UID is a bash variable that is never exported, so it cannot be used
    # directly here — docker-compose reads .env instead.
    user: "${UID:-1000}:${GID:-1000}"
