[project]
name = "fabprint"
version = "0.2.2"
description = "DEPRECATED: fabprint has been renamed to estampo. This package is a compatibility wrapper."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Paul Fremantle", email = "paul@fremantle.org"}]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = ["estampo>=0.2.2"]

[project.urls]
Homepage = "https://estampo.dev"
Repository = "https://github.com/estampo/estampo"

[project.scripts]
fabprint = "fabprint.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
