# CuraEngine example — single filament, Ultimaker 2.
#
# Run:
#   estampo run examples/cura/estampo.toml
#
# Output is standard G-code, ready to use without post-processing.

[plate]
size = [223, 223]
padding = 5.0

[slicer]
engine = "cura"
version = "5.12.0"

[slicer.cura]
printer = "Ultimaker 2"

[slicer.cura.overrides]
infill_sparse_density = 30
infill_pattern = "gyroid"
wall_line_count = 3
speed_print = 50
adhesion_type = "brim"

[[parts]]
file = "cube_10mm.stl"
copies = 2
