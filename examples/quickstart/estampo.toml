# Minimal estampo config — one part, OrcaSlicer, bambox repack for Bambu P1S.
#
# Run:
#   estampo run examples/quickstart/estampo.toml
#
# Requires: bambox (pipx install bambox)

[pipeline]
stages = ["load", "arrange", "plate", "slice", "pack"]

[slicer]
engine = "orca"
version = "2.3.1"

[slicer.orca]
printer = "Bambu Lab P1S 0.4 nozzle"
process = "0.20mm Standard @BBL X1C"

[[parts]]
file = "cube_10mm.stl"

[pack]
command = "bambox repack {sliced_3mf}"
output = "{sliced_3mf}"
