# Multi-filament print with OrcaSlicer and AMS slot assignment.
#
# Run:
#   estampo run examples/multi-filament/estampo.toml
#
# Requires: bambox (pipx install bambox)

[pipeline]
stages = ["load", "arrange", "plate", "slice", "pack"]

[plate]
size = [256, 256]
padding = 8.0

[slicer]
engine = "orca"
version = "2.3.1"
bed_type = "Textured PEI Plate"

[slicer.orca]
printer = "Bambu Lab P1S 0.4 nozzle"
process = "0.20mm Standard @BBL X1C"
filaments = ["Generic PLA @base", "Generic PETG @base"]

[slicer.orca.overrides]
sparse_infill_density = "20%"
bottom_shell_layers = "4"
seam_position = "random"

[slicer.orca.filament_overrides]
nozzle_temperature_initial_layer = "220"

[[parts]]
file = "cube_10mm.stl"
copies = 2
filament = 1

[[parts]]
file = "box_20x20x10.step"
filament = 2

[pack]
command = "bambox repack {sliced_3mf} -o {output_dir}/plate.gcode.3mf"
output = "{output_dir}/plate.gcode.3mf"
