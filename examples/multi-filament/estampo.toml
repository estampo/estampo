# Multi-filament print with OrcaSlicer and AMS slot assignment.
#
# Run:
#   estampo run examples/multi-filament/estampo.toml

[plate]
size = [256, 256]
padding = 8.0

[slicer]
engine = "orca"
bed_type = "Textured PEI Plate"

[slicer.orca]
printer = "Bambu Lab P1S 0.4 nozzle"
process = "0.20mm Standard @BBL X1C"
filaments = ["Generic PLA @base", "Generic PETG @base"]

[[parts]]
file = "cube_10mm.stl"
copies = 2
filament = 1

[[parts]]
file = "box_20x20x10.step"
filament = 2
