# Multi-part plate with arrangement, orientation, scaling, and slicer overrides.
#
# Run:
#   estampo run examples/multi-part/estampo.toml

[plate]
size = [256, 256]
padding = 8.0

[slicer]
engine = "orca"

[slicer.orca]
printer = "Bambu Lab P1S 0.4 nozzle"
process = "0.20mm Standard @BBL X1C"

[slicer.orca.overrides]
sparse_infill_density = "25%"
sparse_infill_pattern = "gyroid"

[[parts]]
file = "cube_10mm.stl"
copies = 3
orient = "flat"

[[parts]]
file = "cylinder_5x20mm.stl"
orient = "upright"
scale = 1.5

[[parts]]
file = "box_20x20x10.step"
orient = "upright"
rotate = [0, 0, 45]
