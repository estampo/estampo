# Multi-part plate with arrangement, orientation, scaling, and slicer overrides.
#
# Run:
#   estampo run examples/multi-part/estampo.toml
#
# Requires: bambox (pipx install bambox)

[pipeline]
stages = ["load", "arrange", "plate", "slice", "pack"]

[plate]
size = [256, 256]
padding = 8.0

[slicer]
engine = "orca"
version = "2.3.1"

[slicer.orca]
printer = "Bambu Lab P1S 0.4 nozzle"
process = "0.20mm Standard @BBL X1C"

[slicer.orca.overrides]
sparse_infill_density = "25%"
sparse_infill_pattern = "gyroid"

[[parts]]
file = "cube_10mm.stl"
copies = 3
orient = "flat"

[[parts]]
file = "cylinder_5x20mm.stl"
orient = "upright"
scale = 1.5

[[parts]]
file = "box_20x20x10.step"
orient = "upright"
rotate = [0, 0, 45]

[pack]
command = "bambox repack {sliced_3mf} -o {output_dir}/plate.gcode.3mf"
output = "{output_dir}/plate.gcode.3mf"
