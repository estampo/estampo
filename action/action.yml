name: "Estampo Slice"
description: "Slice 3D models with estampo and post build metrics to your PR"
branding:
  icon: "box"
  color: "blue"

inputs:
  config:
    description: "Path to estampo.toml (relative to repo root)"
    required: false
    default: "estampo.toml"
  slicer-version:
    description: "Override slicer version (default: read from estampo.toml)"
    required: false
    default: ""
  orca-version:
    description: "DEPRECATED: use slicer-version instead"
    required: false
    default: ""
  until:
    description: "Run pipeline up to this stage (default: run all stages)"
    required: false
    default: ""
  output-dir:
    description: "Output directory for sliced files (relative to repo root)"
    required: false
    default: "estampo_output"
  comment:
    description: "Post a PR comment with build metrics (true/false)"
    required: false
    default: "true"

outputs:
  print-time:
    description: "Estimated print time (human-readable)"
    value: ${{ steps.metrics.outputs.print-time }}
  filament-grams:
    description: "Total filament usage in grams"
    value: ${{ steps.metrics.outputs.filament-grams }}
  layer-count:
    description: "Total number of layers"
    value: ${{ steps.metrics.outputs.layer-count }}
  filament-types:
    description: "Filament types used (comma-separated)"
    value: ${{ steps.metrics.outputs.filament-types }}
  filament-changes:
    description: "Number of filament/tool changes"
    value: ${{ steps.metrics.outputs.filament-changes }}
  gcode-path:
    description: "Path to sliced gcode output directory"
    value: ${{ steps.metrics.outputs.gcode-path }}

runs:
  using: "composite"
  steps:
    - name: Detect slicer engine and version
      id: detect
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
        SLICER_VERSION_OVERRIDE: ${{ inputs.slicer-version }}
        ORCA_VERSION_OVERRIDE: ${{ inputs.orca-version }}
        WORKSPACE: ${{ github.workspace }}
      run: |
        CONFIG_PATH="${WORKSPACE}/${CONFIG}"
        if [ ! -f "$CONFIG_PATH" ]; then
          echo "::error::Config file not found: ${CONFIG_PATH}"
          exit 1
        fi

        # Parse engine from TOML (matches: engine = "orca" or engine = "cura")
        ENGINE=$(sed -n 's/^engine[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "$CONFIG_PATH" | head -1)
        if [ -z "$ENGINE" ]; then
          echo "::error::Could not detect slicer.engine from ${CONFIG} — ensure it contains engine = \"orca\" or engine = \"cura\""
          exit 1
        fi

        # Parse version from TOML (matches: version = "X.Y.Z")
        CONFIG_VERSION=$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "$CONFIG_PATH" | head -1)

        # Version priority: slicer-version input > orca-version input (deprecated) > TOML
        VERSION="${SLICER_VERSION_OVERRIDE}"
        if [ -z "$VERSION" ] && [ -n "$ORCA_VERSION_OVERRIDE" ]; then
          echo "::warning::The 'orca-version' input is deprecated — use 'slicer-version' instead"
          VERSION="${ORCA_VERSION_OVERRIDE}"
        fi
        if [ -z "$VERSION" ]; then
          VERSION="${CONFIG_VERSION}"
        fi

        if [ -z "$VERSION" ]; then
          echo "::error::No slicer version found — set slicer.version in ${CONFIG} or pass the slicer-version input"
          exit 1
        fi

        IMAGE="ghcr.io/estampo/estampo:${ENGINE}-${VERSION}"
        echo "engine=${ENGINE}" >> "$GITHUB_OUTPUT"
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
        echo "Detected engine=${ENGINE} version=${VERSION} → ${IMAGE}"

    - name: Pull estampo image
      shell: bash
      env:
        IMAGE: ${{ steps.detect.outputs.image }}
      run: |
        echo "::group::Pulling ${IMAGE}"
        docker pull "${IMAGE}"
        echo "::endgroup::"

    - name: Run estampo pipeline
      shell: bash
      env:
        IMAGE: ${{ steps.detect.outputs.image }}
        CONFIG: ${{ inputs.config }}
        UNTIL: ${{ inputs.until }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
        WORKSPACE: ${{ github.workspace }}
      run: |
        UNTIL_FLAG=""
        if [ -n "$UNTIL" ]; then
          UNTIL_FLAG="--until ${UNTIL}"
        fi

        docker run --rm \
          -v "${WORKSPACE}:/project" \
          --workdir /project \
          "${IMAGE}" \
          run "${CONFIG}" \
          ${UNTIL_FLAG} \
          --output-dir "/project/${OUTPUT_DIR}" \
          --local \
          -v \
          2>&1 | tee /tmp/estampo-output.log

        # Docker creates files as root — fix ownership so later steps can read them
        sudo chown -R "$(id -u):$(id -g)" "${WORKSPACE}/${OUTPUT_DIR}" 2>/dev/null || true

    - name: Extract build metrics
      id: metrics
      shell: bash
      env:
        OUTPUT_DIR: ${{ inputs.output-dir }}
        CONFIG: ${{ inputs.config }}
        WORKSPACE: ${{ github.workspace }}
      run: |
        FULL_OUTPUT_DIR="${WORKSPACE}/${OUTPUT_DIR}"

        # Read stats from JSON written by estampo pipeline
        STATS_FILE=$(find "${FULL_OUTPUT_DIR}" -name stats.json -type f 2>/dev/null | head -1)
        if [ -n "$STATS_FILE" ]; then
          PRINT_TIME=$(python3 -c "import json; d=json.load(open('$STATS_FILE')); print(d.get('print_time',''))" 2>/dev/null || true)
          FILAMENT=$(python3 -c "import json; d=json.load(open('$STATS_FILE')); print(d.get('filament_g',''))" 2>/dev/null || true)
          LAYERS=$(python3 -c "import json; d=json.load(open('$STATS_FILE')); print(d.get('layer_count',''))" 2>/dev/null || true)
          FILAMENT_TYPES=$(python3 -c "import json; d=json.load(open('$STATS_FILE')); t=d.get('filament_types',[]); print(', '.join(t) if t else '')" 2>/dev/null || true)
          FILAMENT_CHANGES=$(python3 -c "import json; d=json.load(open('$STATS_FILE')); print(d.get('filament_changes',''))" 2>/dev/null || true)
          MACHINE_PROFILE=$(python3 -c "import json; d=json.load(open('$STATS_FILE')); print(d.get('slicer',{}).get('machine',''))" 2>/dev/null || true)
          PROCESS_PROFILE=$(python3 -c "import json; d=json.load(open('$STATS_FILE')); print(d.get('slicer',{}).get('process',''))" 2>/dev/null || true)
          FILAMENT_PROFILES=$(python3 -c "import json; d=json.load(open('$STATS_FILE')); f=d.get('slicer',{}).get('filaments',[]); print(', '.join(f) if f else '')" 2>/dev/null || true)
          OVERRIDE_COUNT=$(python3 -c "import json; d=json.load(open('$STATS_FILE')); print(d.get('slicer',{}).get('override_count',''))" 2>/dev/null || true)
        fi

        # Extract project name: match top-level name only (before any [section] header)
        PROJECT_NAME=$(sed -n '/^\[/q; s/^name\s*=\s*"\(.*\)"/\1/p' "${WORKSPACE}/${CONFIG}" 2>/dev/null || true)

        echo "print-time=${PRINT_TIME}" >> "$GITHUB_OUTPUT"
        echo "filament-grams=${FILAMENT}" >> "$GITHUB_OUTPUT"
        echo "layer-count=${LAYERS}" >> "$GITHUB_OUTPUT"
        echo "filament-types=${FILAMENT_TYPES}" >> "$GITHUB_OUTPUT"
        echo "filament-changes=${FILAMENT_CHANGES}" >> "$GITHUB_OUTPUT"
        echo "gcode-path=${FULL_OUTPUT_DIR}" >> "$GITHUB_OUTPUT"
        echo "project-name=${PROJECT_NAME}" >> "$GITHUB_OUTPUT"
        echo "machine-profile=${MACHINE_PROFILE}" >> "$GITHUB_OUTPUT"
        echo "process-profile=${PROCESS_PROFILE}" >> "$GITHUB_OUTPUT"
        echo "filament-profiles=${FILAMENT_PROFILES}" >> "$GITHUB_OUTPUT"
        echo "override-count=${OVERRIDE_COUNT}" >> "$GITHUB_OUTPUT"

    - name: Job summary
      shell: bash
      env:
        PRINT_TIME: ${{ steps.metrics.outputs.print-time }}
        FILAMENT: ${{ steps.metrics.outputs.filament-grams }}
        LAYERS: ${{ steps.metrics.outputs.layer-count }}
        FILAMENT_TYPES: ${{ steps.metrics.outputs.filament-types }}
        FILAMENT_CHANGES: ${{ steps.metrics.outputs.filament-changes }}
        PROJECT_NAME: ${{ steps.metrics.outputs.project-name }}
        ENGINE: ${{ steps.detect.outputs.engine }}
        VERSION: ${{ steps.detect.outputs.version }}
        MACHINE_PROFILE: ${{ steps.metrics.outputs.machine-profile }}
        PROCESS_PROFILE: ${{ steps.metrics.outputs.process-profile }}
        FILAMENT_PROFILES: ${{ steps.metrics.outputs.filament-profiles }}
        OVERRIDE_COUNT: ${{ steps.metrics.outputs.override-count }}
      run: |
        TITLE="${PROJECT_NAME:+Estampo: $PROJECT_NAME}"
        TITLE="${TITLE:-Estampo Slice Results}"
        ENGINE_LABEL="OrcaSlicer"
        if [ "$ENGINE" = "cura" ]; then
          ENGINE_LABEL="CuraEngine"
        fi
        PROCESS_LABEL="${PROCESS_PROFILE}"
        if [ -n "$OVERRIDE_COUNT" ] && [ "$OVERRIDE_COUNT" != "0" ]; then
          PROCESS_LABEL="${PROCESS_LABEL} (${OVERRIDE_COUNT} overrides)"
        fi
        {
          echo "### ${TITLE}"
          echo ""
          echo "| Metric | Value |"
          echo "|--------|-------|"
          [ -n "$PRINT_TIME" ] && echo "| Print time | ${PRINT_TIME} |"
          [ -n "$FILAMENT" ] && echo "| Filament | ${FILAMENT}g |"
          [ -n "$LAYERS" ] && echo "| Layers | ${LAYERS} |"
          [ -n "$FILAMENT_TYPES" ] && echo "| Filament type | ${FILAMENT_TYPES} |"
          [ -n "$FILAMENT_CHANGES" ] && [ "$FILAMENT_CHANGES" != "0" ] && echo "| Tool changes | ${FILAMENT_CHANGES} |"
          [ -n "$MACHINE_PROFILE" ] && echo "| Machine profile | ${MACHINE_PROFILE} |"
          [ -n "$PROCESS_LABEL" ] && echo "| Process profile | ${PROCESS_LABEL} |"
          [ -n "$FILAMENT_PROFILES" ] && echo "| Filament profile | ${FILAMENT_PROFILES} |"
          echo ""
          echo "Sliced with ${ENGINE_LABEL} ${VERSION}"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: estampo-${{ steps.metrics.outputs.project-name || 'output' }}
        path: ${{ inputs.output-dir }}/
        if-no-files-found: warn

    - name: Post PR comment
      if: ${{ inputs.comment == 'true' && (github.event_name == 'pull_request' || github.event_name == 'workflow_run') }}
      uses: actions/github-script@v9
      env:
        PRINT_TIME: ${{ steps.metrics.outputs.print-time }}
        FILAMENT_GRAMS: ${{ steps.metrics.outputs.filament-grams }}
        LAYER_COUNT: ${{ steps.metrics.outputs.layer-count }}
        FILAMENT_TYPES: ${{ steps.metrics.outputs.filament-types }}
        FILAMENT_CHANGES: ${{ steps.metrics.outputs.filament-changes }}
        ENGINE: ${{ steps.detect.outputs.engine }}
        VERSION: ${{ steps.detect.outputs.version }}
        PROJECT_NAME: ${{ steps.metrics.outputs.project-name }}
        MACHINE_PROFILE: ${{ steps.metrics.outputs.machine-profile }}
        PROCESS_PROFILE: ${{ steps.metrics.outputs.process-profile }}
        FILAMENT_PROFILES: ${{ steps.metrics.outputs.filament-profiles }}
        OVERRIDE_COUNT: ${{ steps.metrics.outputs.override-count }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        EVENT_NAME: ${{ github.event_name }}
        WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
      with:
        script: |
          // Resolve PR number — direct for pull_request, lookup for workflow_run
          let prNumber;
          if (process.env.EVENT_NAME === 'pull_request') {
            prNumber = context.issue.number;
          } else if (process.env.EVENT_NAME === 'workflow_run') {
            const sha = process.env.WORKFLOW_RUN_SHA;
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: sha,
            });
            const openPr = prs.find(pr => pr.state === 'open');
            if (!openPr) {
              core.info(`No open PR found for SHA ${sha} — skipping comment`);
              return;
            }
            prNumber = openPr.number;
          }

          const engine = process.env.ENGINE || 'orca';
          const version = process.env.VERSION || 'unknown';
          const engineLabel = engine === 'cura' ? 'CuraEngine' : 'OrcaSlicer';
          const printTime = process.env.PRINT_TIME || 'unknown';
          const filament = process.env.FILAMENT_GRAMS || 'unknown';
          const layers = process.env.LAYER_COUNT || '';
          const filamentTypes = process.env.FILAMENT_TYPES || '';
          const filamentChanges = process.env.FILAMENT_CHANGES || '';
          const projectName = process.env.PROJECT_NAME || '';
          const machineProfile = process.env.MACHINE_PROFILE || '';
          const processProfile = process.env.PROCESS_PROFILE || '';
          const filamentProfiles = process.env.FILAMENT_PROFILES || '';
          const overrideCount = process.env.OVERRIDE_COUNT || '';
          const runUrl = process.env.RUN_URL;
          const artifactName = `estampo-${projectName || 'output'}`;
          const title = projectName ? `Estampo: ${projectName}` : 'Estampo Slice Results';
          const marker = `<!-- estampo-slice-result-${projectName || 'default'} -->`;

          const processLabel = processProfile
            ? (overrideCount && overrideCount !== '0'
                ? `${processProfile} (${overrideCount} overrides)`
                : processProfile)
            : '';

          const rows = [
            `| Print time | ${printTime} |`,
            `| Filament | ${filament}g |`,
          ];
          if (layers) rows.push(`| Layers | ${layers} |`);
          if (filamentTypes) rows.push(`| Filament type | ${filamentTypes} |`);
          if (filamentChanges && filamentChanges !== '0') rows.push(`| Tool changes | ${filamentChanges} |`);
          if (machineProfile) rows.push(`| Machine profile | ${machineProfile} |`);
          if (processLabel) rows.push(`| Process profile | ${processLabel} |`);
          if (filamentProfiles) rows.push(`| Filament profile | ${filamentProfiles} |`);

          const body = [
            marker,
            `### ${title}`,
            '',
            '| Metric | Value |',
            '|--------|-------|',
            ...rows,
            '',
            `Sliced with ${engineLabel} ${version}`,
            '',
            `> 📦 [Download **${artifactName}**](${runUrl}#artifacts)`,
          ].join('\n');

          // Find existing comment to update
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: prNumber,
          });
          const existing = comments.find(c => c.body.includes(marker));

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });
          }
