[project]
name = "estampo"
version = "0.3.0"
description = "The build system for reproducible 3D prints. Define parts, slicer settings, and printer targets in code."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Paul Fremantle", email = "paul@fremantle.org"}]
keywords = ["3d-printing", "bambu", "orcaslicer", "gcode", "3mf", "slicer", "pipeline", "estampo"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "trimesh[easy]>=4.0.0",
    "rectpack>=0.2.0",
    "defusedxml>=0.7.0",
    "sf-hamilton>=1.82.0",
    "bambulabs-api>=2.6.0",
    "bambu-lab-cloud-api",
    "requests>=2.28",
    "typer>=0.15.0",
    "build123d>=0.10.0",
    "watchfiles>=1.0.0",
    "questionary>=2.1.0",
]

[project.urls]
Homepage = "https://estampo.dev"
Repository = "https://github.com/estampo/estampo"
Issues = "https://github.com/estampo/estampo/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-cov>=6.0.0", "ruff>=0.4.0", "packaging>=23.0", "mypy>=1.10.0", "towncrier>=24.7.0"]

[project.scripts]
estampo = "estampo.cli:main"
fabprint = "estampo.cli:main"  # deprecated alias

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# build123d pins cadquery-ocp<7.9 which needs VTK 9.3 (no longer on PyPI);
# override both to get compatible versions across Python 3.11-3.13
override-dependencies = ["cadquery-ocp>=7.9", "vtk>=9.4"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
check_untyped_defs = true
disable_error_code = ["import-untyped"]

[tool.towncrier]
directory = "changes"
filename = "CHANGELOG.md"
title_format = "## {version} — {project_date}"
issue_format = "[#{issue}](https://github.com/estampo/estampo/pull/{issue})"

  [[tool.towncrier.type]]
  directory = "feature"
  name = "Features"
  showcontent = true

  [[tool.towncrier.type]]
  directory = "bugfix"
  name = "Bugfixes"
  showcontent = true

  [[tool.towncrier.type]]
  directory = "misc"
  name = "Misc"
  showcontent = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "default",
    "ignore:Flat .slicer. config is deprecated:DeprecationWarning:estampo.config",
]
