name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.3, v0.4.0a1) — use only as fallback"
        required: true

jobs:
  # ── Detect release PR merge on push to main ─────────────────────────
  detect-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.check.outputs.is_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Check if this is a release PR merge
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ github.sha }}"
          SUBJECT=$(git log -1 --format=%s "$SHA")
          echo "Commit subject: ${SUBJECT}"

          # Parse the merge-commit subject rather than querying the
          # commits→PRs API. GitHub's PR-association endpoint is
          # eventually consistent and can return [] immediately after a
          # merge, silently skipping the release (see #616). Merge commits
          # from the "Merge pull request" button are deterministic:
          #   "Merge pull request #613 from estampo/release/v0.4.0b4"
          VERSION=$(echo "$SUBJECT" \
            | grep -oP '^Merge pull request #\d+ from [^/]+/release/v\K\d+\.\d+\.\d+((a|b|rc)\d+)?$' \
            | head -1 || true)

          if [[ -n "$VERSION" ]]; then
            # Verify no existing tag. Use the singular `git/ref/...` endpoint
            # — it's an exact lookup (404 if missing). The plural
            # `git/refs/...` endpoint does a *prefix* match and will return
            # e.g. v0.4.0a1 / v0.4.0b4 when asked for v0.4.0, which
            # incorrectly treats an unreleased stable as "already tagged".
            if gh api "repos/${{ github.repository }}/git/ref/tags/v${VERSION}" >/dev/null 2>&1; then
              echo "::warning::Tag v${VERSION} already exists — skipping"
              echo "is_release=false" >> "$GITHUB_OUTPUT"
            else
              echo "is_release=true" >> "$GITHUB_OUTPUT"
              echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
              echo "::notice::Detected release PR merge for v${VERSION}"
            fi
          elif [[ "$SUBJECT" =~ ^Merge\ pull\ request\ #[0-9]+\ from\ [^/]+/release/ ]]; then
            # Commit looks like a release PR merge but the version
            # doesn't parse — fail loud rather than silently skip.
            echo "::error::Commit subject looks like a release PR merge but the branch does not match 'release/vX.Y.Z[abrc]N?': ${SUBJECT}"
            exit 1
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Verify version ──────────────────────────────────────────────────
  version:
    needs: detect-release
    if: |
      always() &&
      ((needs.detect-release.outputs.is_release == 'true') ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Extract and verify version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            # Auto path: version from detect-release
            VERSION="${{ needs.detect-release.outputs.version }}"
          else
            # workflow_dispatch
            TAG="${{ inputs.tag }}"
            VERSION="${TAG#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          TOML_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [[ "$TOML_VERSION" != "$VERSION" ]]; then
            echo "::error::Version mismatch: pyproject.toml=$TOML_VERSION, release=$VERSION"
            exit 1
          fi
          echo "::notice::Releasing version $VERSION"

  # ── Build everything (no publishing) ────────────────────────────────
  build-pypi:
    needs: version
    if: always() && needs.version.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build and validate package
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: pypi-dist
          path: dist/
          retention-days: 5

  build-docker:
    needs: version
    if: always() && needs.version.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        orca-version: ["2.3.1"]  # 2.3.2 disabled: segfaults on slice (exit 139)
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: docker/setup-buildx-action@v4

      - name: Check if orca-base already exists
        id: base_exists
        run: |
          if docker pull "estampo/orca-base:${{ matrix.orca-version }}" 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build orca-base (if needed)
        if: steps.base_exists.outputs.exists == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.orca-base
          platforms: linux/amd64
          push: false
          load: true
          tags: estampo/orca-base:${{ matrix.orca-version }}
          build-args: ORCA_VERSION=${{ matrix.orca-version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build estampo image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: estampo/estampo:orca-${{ matrix.orca-version }}
          build-args: |
            ORCA_VERSION=${{ matrix.orca-version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Capture image digest
        id: digest
        run: |
          DIGEST=$(docker inspect --format='{{.Id}}' "estampo/estampo:orca-${{ matrix.orca-version }}")
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "::notice::Image digest: $DIGEST"

      - name: Save image as artifact
        run: |
          docker save estampo/estampo:orca-${{ matrix.orca-version }} \
            -o estampo-image.tar

      - uses: actions/upload-artifact@v7
        with:
          name: docker-image-${{ matrix.orca-version }}
          path: estampo-image.tar
          retention-days: 5

  build-docker-cura:
    needs: version
    if: always() && needs.version.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cura-version: ["5.12.0"]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: docker/setup-buildx-action@v4

      - name: Check if cura-base already exists
        id: base_exists
        run: |
          if docker pull "estampo/cura-base:${{ matrix.cura-version }}" 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build cura-base (if needed)
        if: steps.base_exists.outputs.exists == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.cura-base
          platforms: linux/amd64
          push: false
          load: true
          tags: estampo/cura-base:${{ matrix.cura-version }}
          build-args: CURA_VERSION=${{ matrix.cura-version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build estampo CuraEngine image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.cura
          platforms: linux/amd64
          push: false
          load: true
          tags: estampo/estampo:cura-${{ matrix.cura-version }}
          build-args: |
            CURA_VERSION=${{ matrix.cura-version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Capture image digest
        id: digest
        run: |
          DIGEST=$(docker inspect --format='{{.Id}}' "estampo/estampo:cura-${{ matrix.cura-version }}")
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "::notice::CuraEngine image digest: $DIGEST"

      - name: Save image as artifact
        run: |
          docker save estampo/estampo:cura-${{ matrix.cura-version }} \
            -o cura-image.tar

      - uses: actions/upload-artifact@v7
        with:
          name: docker-cura-image-${{ matrix.cura-version }}
          path: cura-image.tar
          retention-days: 5

  # ── Dry-run: validate on TestPyPI before real publish ───────────────
  dry-run-publish:
    needs: [version, build-pypi]
    if: always() && needs.version.result == 'success' && needs.build-pypi.result == 'success'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pypi-dist
          path: dist/

      - name: Publish to TestPyPI (dry-run gate)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  # ── Create tag only after TestPyPI succeeds ─────────────────────────
  create-tag:
    needs: [version, detect-release, dry-run-publish]
    # Create tag if it doesn't already exist (works for both push and workflow_dispatch)
    if: |
      always() &&
      needs.version.result == 'success' &&
      needs.dry-run-publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Create and push tag (if it doesn't exist)
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          # Exact-match endpoint (singular `ref`); see detect-release above
          # for why the plural form is wrong.
          if gh api "repos/${{ github.repository }}/git/ref/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "::notice::Tag v${VERSION} already exists — skipping"
          else
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
            echo "::notice::Created tag v${VERSION}"
          fi

  # ── Publish everything ──────────────────────────────────────────────
  publish-pypi:
    needs: [version, create-tag, dry-run-publish, build-docker, build-docker-cura]
    # Run after tag creation for push events, or directly for workflow_dispatch
    if: |
      always() &&
      needs.dry-run-publish.result == 'success' &&
      needs.build-docker.result == 'success' &&
      needs.build-docker-cura.result == 'success' &&
      (needs.create-tag.result == 'success' || needs.create-tag.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pypi-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  publish-docker:
    needs: [version, publish-pypi]
    if: always() && needs.version.result == 'success' && needs.publish-pypi.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        orca-version: ["2.3.1"]  # 2.3.2 disabled: segfaults on slice (exit 139)
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: docker-image-${{ matrix.orca-version }}

      - name: Load image
        run: |
          docker load -i estampo-image.tar
          echo "Loaded image digest: $(docker inspect --format='{{.Id}}' estampo/estampo:orca-${{ matrix.orca-version }})"

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push estampo image
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          ORCA="${{ matrix.orca-version }}"
          docker tag "estampo/estampo:orca-${ORCA}" "estampo/estampo:orca-${ORCA}-${VERSION}"
          docker tag "estampo/estampo:orca-${ORCA}" "ghcr.io/${{ github.repository }}:orca-${ORCA}-${VERSION}"
          docker tag "estampo/estampo:orca-${ORCA}" "ghcr.io/${{ github.repository }}:orca-${ORCA}"
          docker push "estampo/estampo:orca-${ORCA}"
          docker push "estampo/estampo:orca-${ORCA}-${VERSION}"
          docker push "ghcr.io/${{ github.repository }}:orca-${ORCA}-${VERSION}"
          docker push "ghcr.io/${{ github.repository }}:orca-${ORCA}"

  publish-docker-cura:
    needs: [version, publish-pypi]
    if: always() && needs.version.result == 'success' && needs.publish-pypi.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        cura-version: ["5.12.0"]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: docker-cura-image-${{ matrix.cura-version }}

      - name: Load image
        run: |
          docker load -i cura-image.tar
          echo "Loaded image digest: $(docker inspect --format='{{.Id}}' estampo/estampo:cura-${{ matrix.cura-version }})"

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push CuraEngine image
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          CURA="${{ matrix.cura-version }}"
          docker tag "estampo/estampo:cura-${CURA}" "estampo/estampo:cura-${CURA}-${VERSION}"
          docker tag "estampo/estampo:cura-${CURA}" "ghcr.io/${{ github.repository }}:cura-${CURA}-${VERSION}"
          docker tag "estampo/estampo:cura-${CURA}" "ghcr.io/${{ github.repository }}:cura-${CURA}"
          docker push "estampo/estampo:cura-${CURA}"
          docker push "estampo/estampo:cura-${CURA}-${VERSION}"
          docker push "ghcr.io/${{ github.repository }}:cura-${CURA}-${VERSION}"
          docker push "ghcr.io/${{ github.repository }}:cura-${CURA}"

  # ── Create GitHub Release ───────────────────────────────────────────
  github-release:
    needs: [version, publish-pypi, publish-docker, publish-docker-cura]
    if: |
      always() &&
      needs.version.result == 'success' &&
      needs.publish-pypi.result == 'success' &&
      needs.publish-docker.result == 'success' &&
      needs.publish-docker-cura.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          # The "Update action version tag" step below references
          # v${VERSION} as the target of `git tag -f v${MAJOR}`. Without
          # fetch-tags, the shallow checkout does not know the tag just
          # created upstream, and the step fails with
          # "Failed to resolve 'vX.Y.Z' as a valid ref".
          fetch-tags: true

      - uses: actions/download-artifact@v8
        with:
          name: pypi-dist
          path: dist/

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          # Extract section between "## VERSION" and the next "## " heading
          BODY=$(awk "/^## ${VERSION//./\\.} /{found=1; next} /^## /{if(found) exit} found{print}" CHANGELOG.md)
          # Write to file to avoid quoting issues
          echo "$BODY" > /tmp/release-body.md
          echo "Changelog body:"
          cat /tmp/release-body.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          WHEEL=$(ls dist/*.whl 2>/dev/null | head -1)
          ARGS=(gh release create "v${VERSION}" --title "v${VERSION}" --notes-file /tmp/release-body.md)
          # Mark alpha/beta/rc versions as pre-release
          if [[ "$VERSION" =~ (a|b|rc)[0-9]+$ ]]; then
            ARGS+=(--prerelease)
          fi
          if [[ -n "$WHEEL" ]]; then
            ARGS+=("$WHEEL")
          fi
          "${ARGS[@]}"

      - name: Update action version tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          # Only update floating major tag for stable releases (not pre-releases)
          if [[ "$VERSION" =~ (a|b|rc)[0-9]+$ ]]; then
            echo "::notice::Pre-release — skipping action version tag update"
          else
            MAJOR=$(echo "$VERSION" | cut -d. -f1)
            # Force-update the floating vN tag to point to this release
            git tag -f "v${MAJOR}" "v${VERSION}"
            git push -f origin "v${MAJOR}"
            echo "::notice::Updated action tag v${MAJOR} → v${VERSION}"
          fi

      - name: Remind to update website
        run: |
          echo "::notice::Release complete! Remember to redeploy estampo.dev — run the deploy workflow at https://github.com/estampo/website/actions/workflows/deploy.yml"
