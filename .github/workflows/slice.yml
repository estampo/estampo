name: Slice

on:
  workflow_dispatch:
    inputs:
      config:
        description: "Path to estampo.toml"
        required: true
        default: "estampo.toml"
      engine:
        description: "Slicer engine"
        required: true
        default: "orca"
        type: choice
        options:
          - orca
          - cura
      version:
        description: "Slicer version (OrcaSlicer: 2.3.1, CuraEngine: 5.12.0)"
        required: true
        default: "2.3.1"

concurrency:
  group: slice-${{ inputs.engine }}-${{ inputs.version }}
  cancel-in-progress: true

jobs:
  slice-orca:
    if: inputs.engine == 'orca'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Pull or build orca-base image
        run: |
          docker pull estampo/orca-base:${{ inputs.version }} 2>/dev/null \
            || docker build --platform linux/amd64 \
              -f Dockerfile.orca-base \
              --build-arg ORCA_VERSION=${{ inputs.version }} \
              -t estampo/orca-base:${{ inputs.version }} .

      - name: Build estampo image
        run: |
          docker build \
            --build-arg ORCA_VERSION=${{ inputs.version }} \
            -t estampo/estampo:orca-${{ inputs.version }} .

      - name: Generate plate and slice
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/project" \
            estampo/estampo:orca-${{ inputs.version }} \
            run "${{ inputs.config }}" -v

      - name: Upload gcode
        uses: actions/upload-artifact@v7
        with:
          name: gcode
          path: |
            output/*.gcode
            plate.3mf

  slice-cura:
    if: inputs.engine == 'cura'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Pull or build cura-base image
        run: |
          docker pull estampo/cura-base:${{ inputs.version }} 2>/dev/null \
            || docker build --platform linux/amd64 \
              -f Dockerfile.cura-base \
              --build-arg CURA_VERSION=${{ inputs.version }} \
              -t estampo/cura-base:${{ inputs.version }} .

      - name: Build estampo CuraEngine image
        run: |
          docker build --platform linux/amd64 \
            -f Dockerfile.cura \
            --build-arg CURA_VERSION=${{ inputs.version }} \
            -t estampo/estampo:cura-${{ inputs.version }} .

      - name: Generate plate and slice
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/project" \
            estampo/estampo:cura-${{ inputs.version }} \
            run "${{ inputs.config }}" --local -v

      - name: Upload gcode
        uses: actions/upload-artifact@v7
        with:
          name: gcode
          path: |
            output/*.gcode
            estampo_output/
