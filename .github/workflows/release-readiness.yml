name: Release Readiness

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"  # nightly at 06:00 UTC
  workflow_dispatch:
    inputs:
      orca_version:
        description: "OrcaSlicer version to test"
        required: true
        default: "2.3.1"
  workflow_call:
    inputs:
      orca_version:
        description: "OrcaSlicer version to test"
        type: string
        default: "2.3.1"

concurrency:
  group: release-readiness-${{ github.ref }}
  cancel-in-progress: true

env:
  ORCA_VERSION: ${{ inputs.orca_version || '2.3.1' }}

jobs:
  detect-changes:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - id: filter
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          if echo "$CHANGED" | grep -qE '^(Dockerfile|Dockerfile\.|scripts/extract_profiles\.py|src/estampo/|pyproject\.toml|uv\.lock|examples/|\.github/workflows/)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  build-estampo-image:
    needs: detect-changes
    if: always() && !failure() && !cancelled() && (needs.detect-changes.result == 'skipped' || needs.detect-changes.outputs.relevant == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull or build orca-base image
        run: |
          docker pull estampo/orca-base:${{ env.ORCA_VERSION }} 2>/dev/null \
            || docker build --platform linux/amd64 \
              -f Dockerfile.orca-base \
              --build-arg ORCA_VERSION=${{ env.ORCA_VERSION }} \
              -t estampo/orca-base:${{ env.ORCA_VERSION }} .

      - name: Build estampo image
        run: |
          docker build --platform linux/amd64 \
            --build-arg ORCA_VERSION=${{ env.ORCA_VERSION }} \
            -t estampo/estampo:orca-${{ env.ORCA_VERSION }}-test .

      - name: Save image as artifact
        run: |
          docker save estampo/estampo:orca-${{ env.ORCA_VERSION }}-test \
            -o estampo-image.tar

      - uses: actions/upload-artifact@v7
        with:
          name: estampo-image
          path: estampo-image.tar
          retention-days: 1

  build-cloud-bridge:
    needs: detect-changes
    if: always() && !failure() && !cancelled() && (needs.detect-changes.result == 'skipped' || needs.detect-changes.outputs.relevant == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build cloud-bridge image
        run: |
          docker build --platform linux/amd64 \
            -f Dockerfile.cloud-bridge \
            -t estampo/cloud-bridge:test .

      - name: Smoke test cloud-bridge
        run: |
          docker run --rm estampo/cloud-bridge:test --help

  smoke-test:
    needs: build-estampo-image
    if: needs.build-estampo-image.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: estampo-image

      - name: Load image
        run: docker load -i estampo-image.tar

      - name: Test estampo CLI
        run: |
          docker run --rm estampo/estampo:orca-${{ env.ORCA_VERSION }}-test --help
          docker run --rm estampo/estampo:orca-${{ env.ORCA_VERSION }}-test run --help

      - name: Test OrcaSlicer accessible
        run: |
          docker run --rm --entrypoint orca-slicer \
            estampo/estampo:orca-${{ env.ORCA_VERSION }}-test --help

  profile-extraction:
    needs: build-estampo-image
    if: needs.build-estampo-image.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          name: estampo-image

      - name: Load image
        run: docker load -i estampo-image.tar

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install project
        run: |
          pip install uv
          uv sync --extra dev

      - name: Extract profiles
        run: |
          uv run python scripts/extract_profiles.py \
            ${{ env.ORCA_VERSION }} \
            --image estampo/estampo:orca-${{ env.ORCA_VERSION }}-test

      - name: Validate profile JSON
        run: |
          python3 -c "
          import json, sys
          f = 'src/estampo/data/profiles.orca.${{ env.ORCA_VERSION }}.json'
          d = json.load(open(f))
          assert d['engine'] == 'orca', f'bad engine: {d[\"engine\"]}'
          assert d['version'] == '${{ env.ORCA_VERSION }}', f'bad version: {d[\"version\"]}'
          for cat in ('machine', 'process', 'filament'):
              n = len(d[cat])
              assert n > 0, f'{cat} list is empty'
              print(f'  {cat}: {n} profiles')
          print('Profile extraction OK')
          "

      - name: Commit updated profiles
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git diff --quiet src/estampo/data/ && echo "No profile changes" && exit 0
          BRANCH="update-orca-profiles-$(date +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add src/estampo/data/
          git commit -m "Update bundled OrcaSlicer profiles (${{ env.ORCA_VERSION }})"
          git push origin "$BRANCH"
          gh pr create \
            --title "Update bundled OrcaSlicer profiles" \
            --body "Auto-extracted from estampo/estampo:orca-${{ env.ORCA_VERSION }}-test." \
            --base main \
            --head "$BRANCH"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  slice-test:
    needs: build-estampo-image
    if: needs.build-estampo-image.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          name: estampo-image

      - name: Load image
        run: docker load -i estampo-image.tar

      - name: Run slice with example config
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/project" \
            -w /project/examples \
            estampo/estampo:orca-${{ env.ORCA_VERSION }}-test \
            run estampo.toml -v

      - name: Verify output
        run: |
          echo "Checking for slice output..."
          ls -la examples/estampo_output/
          echo "Slice test OK"

      - uses: actions/upload-artifact@v7
        with:
          name: slice-output
          path: examples/estampo_output/
          retention-days: 5
