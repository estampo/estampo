name: Release Readiness

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"  # nightly at 06:00 UTC
  workflow_dispatch:
    inputs:
      orca_version:
        description: "OrcaSlicer version to test"
        required: true
        default: "2.3.1"
      cura_version:
        description: "CuraEngine version to test"
        required: true
        default: "5.12.0"
  # NOTE: workflow_call was removed because calling this workflow from a
  # tag-push-triggered workflow causes startup_failure (zero jobs created).
  # See: https://github.com/estampo/estampo/pull/244
  # Release gating is now handled by CI on the release PR + TestPyPI dry-run.

concurrency:
  group: release-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - id: filter
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          if echo "$CHANGED" | grep -qE '^(Dockerfile|Dockerfile\.|scripts/extract_profiles\.py|src/estampo/|pyproject\.toml|uv\.lock|examples/|\.github/workflows/)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  # Resolve which OrcaSlicer versions to build/test.  Manual dispatch
  # tests a single version; automated runs test all supported versions.
  resolve-versions:
    needs: detect-changes
    if: always() && !failure() && !cancelled() && (needs.detect-changes.result == 'skipped' || needs.detect-changes.outputs.relevant == 'true')
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.set.outputs.versions }}
    steps:
      - id: set
        run: |
          if [ -n "${{ inputs.orca_version }}" ]; then
            echo 'versions=["${{ inputs.orca_version }}"]' >> "$GITHUB_OUTPUT"
          else
            echo 'versions=["2.3.1"]' >> "$GITHUB_OUTPUT"  # 2.3.2 disabled: segfaults on slice
          fi

  build-estampo-image:
    needs: resolve-versions
    if: always() && needs.resolve-versions.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        orca_version: ${{ fromJson(needs.resolve-versions.outputs.versions) }}
    steps:
      - uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull or build orca-base image
        run: |
          docker pull estampo/orca-base:${{ matrix.orca_version }} 2>/dev/null \
            || docker build --platform linux/amd64 \
              -f Dockerfile.orca-base \
              --build-arg ORCA_VERSION=${{ matrix.orca_version }} \
              -t estampo/orca-base:${{ matrix.orca_version }} .

      - name: Build estampo image
        run: |
          docker build --platform linux/amd64 \
            --build-arg ORCA_VERSION=${{ matrix.orca_version }} \
            -t estampo/estampo:orca-${{ matrix.orca_version }}-test .

      - name: Save image as artifact
        run: |
          docker save estampo/estampo:orca-${{ matrix.orca_version }}-test \
            -o estampo-image.tar

      - uses: actions/upload-artifact@v7
        with:
          name: estampo-image-${{ matrix.orca_version }}
          path: estampo-image.tar
          retention-days: 1

  smoke-test:
    needs: [resolve-versions, build-estampo-image]
    if: always() && needs.build-estampo-image.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        orca_version: ${{ fromJson(needs.resolve-versions.outputs.versions) }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: estampo-image-${{ matrix.orca_version }}

      - name: Load image
        run: docker load -i estampo-image.tar

      - name: Test estampo CLI
        run: |
          docker run --rm estampo/estampo:orca-${{ matrix.orca_version }}-test --help
          docker run --rm estampo/estampo:orca-${{ matrix.orca_version }}-test run --help

      - name: Test OrcaSlicer accessible
        run: |
          docker run --rm --entrypoint orca-slicer \
            estampo/estampo:orca-${{ matrix.orca_version }}-test --help

  profile-extraction:
    needs: [resolve-versions, build-estampo-image]
    if: always() && needs.build-estampo-image.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        orca_version: ${{ fromJson(needs.resolve-versions.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          name: estampo-image-${{ matrix.orca_version }}

      - name: Load image
        run: docker load -i estampo-image.tar

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install project
        run: |
          pip install uv
          uv sync --extra dev

      - name: Extract profiles
        run: |
          uv run python scripts/extract_profiles.py \
            ${{ matrix.orca_version }} \
            --image estampo/estampo:orca-${{ matrix.orca_version }}-test

      - name: Validate profile JSON
        run: |
          python3 -c "
          import json, sys
          f = 'src/estampo/data/profiles.orca.${{ matrix.orca_version }}.json'
          d = json.load(open(f))
          assert d['engine'] == 'orca', f'bad engine: {d[\"engine\"]}'
          assert d['version'] == '${{ matrix.orca_version }}', f'bad version: {d[\"version\"]}'
          for cat in ('machine', 'process', 'filament'):
              n = len(d[cat])
              assert n > 0, f'{cat} list is empty'
              print(f'  {cat}: {n} profiles')
          print('Profile extraction OK')
          "

      - name: Commit updated profiles
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git add src/estampo/data/
          git diff --cached --quiet src/estampo/data/ && echo "No profile changes" && exit 0
          BRANCH="update-orca-profiles-${{ matrix.orca_version }}-$(date +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          echo "Update bundled OrcaSlicer ${{ matrix.orca_version }} profiles" > changes/+update-orca-profiles.misc
          git add changes/
          git commit -m "Update bundled OrcaSlicer profiles (${{ matrix.orca_version }})"
          git push --force origin "$BRANCH"
          gh pr create \
            --title "Update bundled OrcaSlicer ${{ matrix.orca_version }} profiles" \
            --body "Auto-extracted from estampo/estampo:orca-${{ matrix.orca_version }}-test." \
            --base main \
            --head "$BRANCH" \
          || echo "::warning::Could not create PR automatically. Branch '$BRANCH' pushed — create the PR manually."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  slice-test:
    needs: [resolve-versions, build-estampo-image]
    if: always() && needs.build-estampo-image.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        orca_version: ${{ fromJson(needs.resolve-versions.outputs.versions) }}
        example:
          - name: generic
            workdir: examples
          - name: decoy-case
            workdir: examples/decoy-case
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          name: estampo-image-${{ matrix.orca_version }}

      - name: Load image
        run: |
          docker load -i estampo-image.tar
          # Re-tag so estampo finds the image under its expected name
          docker tag estampo/estampo:orca-${{ matrix.orca_version }}-test \
                     estampo/estampo:orca-${{ matrix.orca_version }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install estampo
        run: |
          pip install uv
          uv sync --frozen --no-dev

      # Run estampo the same way a user does: from the host, letting
      # estampo invoke Docker.  This exercises the real docker-run path
      # (--entrypoint orca-slicer) instead of running inside the container
      # which falls back to local slicer and can behave differently.
      - name: Run slice (${{ matrix.example.name }} on orca-${{ matrix.orca_version }})
        run: |
          SHORT=$(echo "${{ matrix.orca_version }}" | tr -d '.')
          cd ${{ matrix.example.workdir }}
          uv run estampo run "estampo-${SHORT}.toml" -v

      - name: Verify output
        run: |
          echo "Checking for slice output..."
          ls -la ${{ matrix.example.workdir }}/estampo_output/
          echo "Slice test OK — ${{ matrix.example.name }} on orca-${{ matrix.orca_version }}"

      - uses: actions/upload-artifact@v7
        with:
          name: slice-output-${{ matrix.example.name }}-${{ matrix.orca_version }}
          path: ${{ matrix.example.workdir }}/estampo_output/
          retention-days: 5

  # --- CuraEngine ---

  build-cura-image:
    needs: resolve-versions
    if: always() && needs.resolve-versions.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cura_version: ["5.12.0"]
    steps:
      - uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull or build cura-base image
        run: |
          docker pull estampo/cura-base:${{ matrix.cura_version }} 2>/dev/null \
            || docker build --platform linux/amd64 \
              -f Dockerfile.cura-base \
              --build-arg CURA_VERSION=${{ matrix.cura_version }} \
              -t estampo/cura-base:${{ matrix.cura_version }} .

      - name: Build estampo CuraEngine image
        run: |
          docker build --platform linux/amd64 \
            -f Dockerfile.cura \
            --build-arg CURA_VERSION=${{ matrix.cura_version }} \
            -t estampo/estampo:cura-${{ matrix.cura_version }}-test .

      - name: Save image as artifact
        run: |
          docker save estampo/estampo:cura-${{ matrix.cura_version }}-test \
            -o cura-image.tar

      - uses: actions/upload-artifact@v7
        with:
          name: cura-image-${{ matrix.cura_version }}
          path: cura-image.tar
          retention-days: 1

  cura-smoke-test:
    needs: build-cura-image
    if: always() && needs.build-cura-image.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cura_version: ["5.12.0"]
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: cura-image-${{ matrix.cura_version }}

      - name: Load image
        run: docker load -i cura-image.tar

      - name: Test estampo CLI
        run: |
          docker run --rm estampo/estampo:cura-${{ matrix.cura_version }}-test --help
          docker run --rm estampo/estampo:cura-${{ matrix.cura_version }}-test run --help

      - name: Test CuraEngine accessible
        run: |
          docker run --rm --entrypoint CuraEngine \
            estampo/estampo:cura-${{ matrix.cura_version }}-test help

  cura-profile-extraction:
    needs: build-cura-image
    if: always() && needs.build-cura-image.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cura_version: ["5.12.0"]
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          name: cura-image-${{ matrix.cura_version }}

      - name: Load image
        run: docker load -i cura-image.tar

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install project
        run: |
          pip install uv
          uv sync --extra dev

      - name: Extract CuraEngine definitions
        run: |
          uv run python scripts/extract_profiles.py \
            --engine cura \
            ${{ matrix.cura_version }} \
            --image estampo/estampo:cura-${{ matrix.cura_version }}-test

      - name: Validate definition manifest
        run: |
          python3 -c "
          import json, sys
          f = 'src/estampo/data/profiles.cura.${{ matrix.cura_version }}.json'
          d = json.load(open(f))
          assert d['engine'] == 'cura', f'bad engine: {d[\"engine\"]}'
          assert d['version'] == '${{ matrix.cura_version }}', f'bad version: {d[\"version\"]}'
          machines = d['machine']
          assert len(machines) > 0, 'machine list is empty'
          for m in machines:
              assert 'name' in m and 'id' in m, f'bad entry: {m}'
          print(f'  machine: {len(machines)} printer definitions')
          print('CuraEngine definition extraction OK')
          "

      - name: Commit updated definitions
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git add src/estampo/data/
          git diff --cached --quiet src/estampo/data/ && echo "No definition changes" && exit 0
          BRANCH="update-cura-definitions-${{ matrix.cura_version }}-$(date +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          echo "Update bundled CuraEngine ${{ matrix.cura_version }} definitions" > changes/+update-cura-definitions.misc
          git add changes/
          git commit -m "Update bundled CuraEngine definitions (${{ matrix.cura_version }})"
          git push --force origin "$BRANCH"
          gh pr create \
            --title "Update bundled CuraEngine ${{ matrix.cura_version }} definitions" \
            --body "Auto-extracted from estampo/estampo:cura-${{ matrix.cura_version }}-test." \
            --base main \
            --head "$BRANCH" \
          || echo "::warning::Could not create PR automatically. Branch '$BRANCH' pushed — create the PR manually."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cura-slice-test:
    needs: build-cura-image
    if: always() && needs.build-cura-image.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cura_version: ["5.12.0"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          name: cura-image-${{ matrix.cura_version }}

      - name: Load image
        run: |
          docker load -i cura-image.tar
          # Re-tag so estampo finds the image under its expected name
          docker tag estampo/estampo:cura-${{ matrix.cura_version }}-test \
                     estampo/estampo:cura-${{ matrix.cura_version }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install estampo
        run: |
          pip install uv
          uv sync --frozen --no-dev

      - name: Run slice (CuraEngine ${{ matrix.cura_version }})
        run: |
          cd examples
          uv run estampo run estampo-cura.toml -v

      - name: Verify output
        run: |
          echo "Checking for slice output..."
          ls -la examples/estampo_output/
          echo "Slice test OK — CuraEngine ${{ matrix.cura_version }}"

      - uses: actions/upload-artifact@v7
        with:
          name: slice-output-cura-${{ matrix.cura_version }}
          path: examples/estampo_output/
          retention-days: 5
