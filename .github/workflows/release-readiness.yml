name: Release Readiness

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"  # nightly at 06:00 UTC
  workflow_dispatch:
    inputs:
      orca_version:
        description: "OrcaSlicer version to test"
        required: true
        default: "2.3.1"
      cura_version:
        description: "CuraEngine version to test"
        required: true
        default: "5.12.0"
  # NOTE: workflow_call was removed because calling this workflow from a
  # tag-push-triggered workflow causes startup_failure (zero jobs created).
  # See: https://github.com/estampo/estampo/pull/244
  # Release gating is now handled by CI on the release PR + TestPyPI dry-run.

concurrency:
  group: release-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - id: filter
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          if echo "$CHANGED" | grep -qE '^(Dockerfile|Dockerfile\.|scripts/extract_profiles\.py|src/estampo/|pyproject\.toml|uv\.lock|examples/|\.github/workflows/)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  # Resolve which OrcaSlicer versions to build/test.  Manual dispatch
  # tests a single version; automated runs test all supported versions.
  resolve-versions:
    needs: detect-changes
    if: always() && !failure() && !cancelled() && (needs.detect-changes.result == 'skipped' || needs.detect-changes.outputs.relevant == 'true')
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.set.outputs.versions }}
    steps:
      - id: set
        run: |
          if [ -n "${{ inputs.orca_version }}" ]; then
            echo 'versions=["${{ inputs.orca_version }}"]' >> "$GITHUB_OUTPUT"
          else
            echo 'versions=["2.3.1"]' >> "$GITHUB_OUTPUT"  # 2.3.2 disabled: segfaults on slice
          fi

  build-estampo-image:
    needs: resolve-versions
    if: always() && needs.resolve-versions.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        orca_version: ${{ fromJson(needs.resolve-versions.outputs.versions) }}
    steps:
      - uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull or build orca-base image
        run: |
          docker pull estampo/orca-base:${{ matrix.orca_version }} 2>/dev/null \
            || docker build --platform linux/amd64 \
              -f Dockerfile.orca-base \
              --build-arg ORCA_VERSION=${{ matrix.orca_version }} \
              -t estampo/orca-base:${{ matrix.orca_version }} .

      - name: Build estampo image
        run: |
          docker build --platform linux/amd64 \
            --build-arg ORCA_VERSION=${{ matrix.orca_version }} \
            -t estampo/estampo:orca-${{ matrix.orca_version }}-test .

      - name: Save image as artifact
        run: |
          docker save estampo/estampo:orca-${{ matrix.orca_version }}-test \
            -o estampo-image.tar

      - uses: actions/upload-artifact@v7
        with:
          name: estampo-image-${{ matrix.orca_version }}
          path: estampo-image.tar
          retention-days: 1

  smoke-test:
    needs: [resolve-versions, build-estampo-image]
    if: always() && needs.build-estampo-image.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        orca_version: ${{ fromJson(needs.resolve-versions.outputs.versions) }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: estampo-image-${{ matrix.orca_version }}

      - name: Load image
        run: docker load -i estampo-image.tar

      - name: Test estampo CLI
        run: |
          docker run --rm estampo/estampo:orca-${{ matrix.orca_version }}-test --help
          docker run --rm estampo/estampo:orca-${{ matrix.orca_version }}-test run --help

      - name: Test OrcaSlicer accessible
        run: |
          docker run --rm --entrypoint orca-slicer \
            estampo/estampo:orca-${{ matrix.orca_version }}-test --help

  profile-extraction:
    needs: [resolve-versions, build-estampo-image]
    if: always() && needs.build-estampo-image.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        orca_version: ${{ fromJson(needs.resolve-versions.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: estampo-image-${{ matrix.orca_version }}

      - name: Load image
        run: docker load -i estampo-image.tar

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install project
        run: |
          pip install uv
          uv sync --extra dev

      - name: Extract profiles
        run: |
          uv run python scripts/extract_profiles.py \
            ${{ matrix.orca_version }} \
            --image estampo/estampo:orca-${{ matrix.orca_version }}-test

      - name: Validate profile JSON
        run: |
          python3 -c "
          import json, sys
          f = 'src/estampo/data/profiles.orca.${{ matrix.orca_version }}.json'
          d = json.load(open(f))
          assert d['engine'] == 'orca', f'bad engine: {d[\"engine\"]}'
          assert d['version'] == '${{ matrix.orca_version }}', f'bad version: {d[\"version\"]}'
          for cat in ('machine', 'process', 'filament'):
              n = len(d[cat])
              assert n > 0, f'{cat} list is empty'
              print(f'  {cat}: {n} profiles')
          print('Profile extraction OK')
          "

      - name: Commit updated profiles
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git add src/estampo/data/
          git diff --cached --quiet src/estampo/data/ && echo "No profile changes" && exit 0
          BRANCH="update-orca-profiles-${{ matrix.orca_version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          echo "Update bundled OrcaSlicer ${{ matrix.orca_version }} profiles" > changes/+update-orca-profiles.misc
          git add changes/
          git commit -m "Update bundled OrcaSlicer profiles (${{ matrix.orca_version }})"
          git push --force origin "$BRANCH"
          gh pr create \
            --title "Update bundled OrcaSlicer ${{ matrix.orca_version }} profiles" \
            --body "Auto-extracted from estampo/estampo:orca-${{ matrix.orca_version }}-test." \
            --base main \
            --head "$BRANCH" \
          || echo "::warning::Could not create PR automatically. Branch '$BRANCH' pushed — create the PR manually."
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}

  slice-test:
    needs: [resolve-versions, build-estampo-image]
    if: always() && needs.build-estampo-image.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        orca_version: ${{ fromJson(needs.resolve-versions.outputs.versions) }}
        example:
          - name: quickstart
            workdir: examples/quickstart
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: estampo-image-${{ matrix.orca_version }}

      - name: Load image
        run: docker load -i estampo-image.tar

      # Run entire pipeline inside the container — bambox is bundled so
      # pack/repack stages work.  Uses --local because we're already inside
      # the image (no docker-in-docker).
      - name: Run pipeline (${{ matrix.example.name }} on orca-${{ matrix.orca_version }})
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/project" \
            --workdir /project/${{ matrix.example.workdir }} \
            estampo/estampo:orca-${{ matrix.orca_version }}-test \
            run estampo.toml --local -v

      - name: Verify .gcode.3mf output
        run: |
          echo "Checking for packaged output..."
          ls -la ${{ matrix.example.workdir }}/estampo_output/
          PACKED=$(find ${{ matrix.example.workdir }}/estampo_output/ -name '*.gcode.3mf' | head -1)
          if [ -z "$PACKED" ]; then
            echo "::error::No .gcode.3mf found — pack stage failed"
            exit 1
          fi
          echo "E2E OK — ${{ matrix.example.name }} on orca-${{ matrix.orca_version }}: $PACKED"

      - uses: actions/upload-artifact@v7
        with:
          name: slice-output-${{ matrix.example.name }}-${{ matrix.orca_version }}
          path: ${{ matrix.example.workdir }}/estampo_output/
          retention-days: 5

  # Regression coverage for #641: run estampo from the host (not inside the
  # container) against a config with `docker = true` on the pack stage.
  # This exercises the host → `docker run` → container code path, which
  # `slice-test` cannot (it runs with --local, already inside the image).
  # A broken Python install inside the image (as in #641) would pass
  # `slice-test` but fail here.
  docker-pack-test:
    needs: [resolve-versions, build-estampo-image]
    if: always() && needs.build-estampo-image.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        orca_version: ${{ fromJson(needs.resolve-versions.outputs.versions) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: estampo-image-${{ matrix.orca_version }}

      - name: Load image and re-tag
        # estampo resolves the image via docker_image() → estampo/estampo:orca-<v>
        run: |
          docker load -i estampo-image.tar
          docker tag estampo/estampo:orca-${{ matrix.orca_version }}-test \
                     estampo/estampo:orca-${{ matrix.orca_version }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install estampo on host
        run: pip install -e .

      - name: Prepare project with docker=true pack
        run: |
          mkdir -p "$RUNNER_TEMP/docker-pack"
          cp examples/quickstart/cube_10mm.stl "$RUNNER_TEMP/docker-pack/"
          cat > "$RUNNER_TEMP/docker-pack/estampo.toml" <<TOML
          [pipeline]
          stages = ["load", "arrange", "plate", "slice", "pack"]

          [slicer]
          engine = "orca"
          version = "${{ matrix.orca_version }}"

          [slicer.orca]
          printer = "Bambu Lab P1S 0.4 nozzle"
          process = "0.20mm Standard @BBL X1C"

          [[parts]]
          file = "cube_10mm.stl"

          [pack]
          command = "bambox repack {sliced_3mf}"
          output = "{sliced_3mf}"
          docker = true
          TOML
          cat "$RUNNER_TEMP/docker-pack/estampo.toml"

      - name: Run pipeline (host → docker pack)
        working-directory: ${{ runner.temp }}/docker-pack
        run: estampo run estampo.toml -v

      - name: Verify .gcode.3mf output
        run: |
          PACKED=$(find "$RUNNER_TEMP/docker-pack/estampo_output" -name '*.gcode.3mf' | head -1)
          if [ -z "$PACKED" ]; then
            echo "::error::No .gcode.3mf found — docker=true pack stage failed (regression of #641?)"
            ls -la "$RUNNER_TEMP/docker-pack/estampo_output/" || true
            exit 1
          fi
          echo "Docker-pack OK: $PACKED"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: docker-pack-output-${{ matrix.orca_version }}
          path: ${{ runner.temp }}/docker-pack/estampo_output/
          retention-days: 5

  # --- CuraEngine ---

  build-cura-image:
    needs: resolve-versions
    if: always() && needs.resolve-versions.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cura_version: ["5.12.0"]
    steps:
      - uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull or build cura-base image
        run: |
          docker pull estampo/cura-base:${{ matrix.cura_version }} 2>/dev/null \
            || docker build --platform linux/amd64 \
              -f Dockerfile.cura-base \
              --build-arg CURA_VERSION=${{ matrix.cura_version }} \
              -t estampo/cura-base:${{ matrix.cura_version }} .

      - name: Build estampo CuraEngine image
        run: |
          docker build --platform linux/amd64 \
            -f Dockerfile.cura \
            --build-arg CURA_VERSION=${{ matrix.cura_version }} \
            -t estampo/estampo:cura-${{ matrix.cura_version }}-test .

      - name: Save image as artifact
        run: |
          docker save estampo/estampo:cura-${{ matrix.cura_version }}-test \
            -o cura-image.tar

      - uses: actions/upload-artifact@v7
        with:
          name: cura-image-${{ matrix.cura_version }}
          path: cura-image.tar
          retention-days: 1

  cura-smoke-test:
    needs: build-cura-image
    if: always() && needs.build-cura-image.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cura_version: ["5.12.0"]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: cura-image-${{ matrix.cura_version }}

      - name: Load image
        run: docker load -i cura-image.tar

      - name: Test estampo CLI
        run: |
          docker run --rm estampo/estampo:cura-${{ matrix.cura_version }}-test --help
          docker run --rm estampo/estampo:cura-${{ matrix.cura_version }}-test run --help

      - name: Test CuraEngine accessible
        run: |
          docker run --rm --entrypoint CuraEngine \
            estampo/estampo:cura-${{ matrix.cura_version }}-test help

  cura-profile-extraction:
    needs: build-cura-image
    if: always() && needs.build-cura-image.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cura_version: ["5.12.0"]
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: cura-image-${{ matrix.cura_version }}

      - name: Load image
        run: docker load -i cura-image.tar

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install project
        run: |
          pip install uv
          uv sync --extra dev

      - name: Extract CuraEngine definitions
        run: |
          uv run python scripts/extract_profiles.py \
            --engine cura \
            ${{ matrix.cura_version }} \
            --image estampo/estampo:cura-${{ matrix.cura_version }}-test

      - name: Validate definition manifest
        run: |
          python3 -c "
          import json, sys
          f = 'src/estampo/data/profiles.cura.${{ matrix.cura_version }}.json'
          d = json.load(open(f))
          assert d['engine'] == 'cura', f'bad engine: {d[\"engine\"]}'
          assert d['version'] == '${{ matrix.cura_version }}', f'bad version: {d[\"version\"]}'
          machines = d['machine']
          assert len(machines) > 0, 'machine list is empty'
          for m in machines:
              assert 'name' in m and 'id' in m, f'bad entry: {m}'
          print(f'  machine: {len(machines)} printer definitions')
          print('CuraEngine definition extraction OK')
          "

      - name: Commit updated definitions
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git add src/estampo/data/
          git diff --cached --quiet src/estampo/data/ && echo "No definition changes" && exit 0
          BRANCH="update-cura-definitions-${{ matrix.cura_version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          echo "Update bundled CuraEngine ${{ matrix.cura_version }} definitions" > changes/+update-cura-definitions.misc
          git add changes/
          git commit -m "Update bundled CuraEngine definitions (${{ matrix.cura_version }})"
          git push --force origin "$BRANCH"
          gh pr create \
            --title "Update bundled CuraEngine ${{ matrix.cura_version }} definitions" \
            --body "Auto-extracted from estampo/estampo:cura-${{ matrix.cura_version }}-test." \
            --base main \
            --head "$BRANCH" \
          || echo "::warning::Could not create PR automatically. Branch '$BRANCH' pushed — create the PR manually."
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}

  cura-slice-test:
    needs: build-cura-image
    if: always() && needs.build-cura-image.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cura_version: ["5.12.0"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: cura-image-${{ matrix.cura_version }}

      - name: Load image
        run: docker load -i cura-image.tar

      # Run entire pipeline inside the container — cura-p1s and bambox are
      # bundled so resolve_templates + pack stages work.
      - name: Run pipeline (cura-p1s on CuraEngine ${{ matrix.cura_version }})
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/project" \
            --workdir /project/examples/cura-p1s \
            estampo/estampo:cura-${{ matrix.cura_version }}-test \
            run estampo.toml --local -v

      - name: Verify .gcode.3mf output
        run: |
          echo "Checking for packaged output..."
          ls -la examples/cura-p1s/estampo_output/
          PACKED=$(find examples/cura-p1s/estampo_output/ -name '*.gcode.3mf' | head -1)
          if [ -z "$PACKED" ]; then
            echo "::error::No .gcode.3mf found — pack stage failed"
            exit 1
          fi
          echo "E2E OK — cura-p1s on CuraEngine ${{ matrix.cura_version }}: $PACKED"

      - uses: actions/upload-artifact@v7
        with:
          name: slice-output-cura-p1s-${{ matrix.cura_version }}
          path: examples/cura-p1s/estampo_output/
          retention-days: 5
