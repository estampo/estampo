name: Publish Docker images

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rebuild-base:
        description: "Rebuild orca-base images (normally only on release tags)"
        type: boolean
        default: false

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      bridge: ${{ steps.check.outputs.bridge }}
      fabprint: ${{ steps.check.outputs.fabprint }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Detect changed files
        id: check
        run: |
          CHANGED=$(git diff HEAD~1 HEAD --name-only)
          echo "$CHANGED" | grep -qE 'Dockerfile\.cloud-bridge|scripts/bambu_cloud_bridge\.cpp' \
            && echo "bridge=true" >> "$GITHUB_OUTPUT" || echo "bridge=false" >> "$GITHUB_OUTPUT"
          echo "$CHANGED" | grep -qE '^Dockerfile$|^src/fabprint/|^pyproject\.toml$|^uv\.lock$' \
            && echo "fabprint=true" >> "$GITHUB_OUTPUT" || echo "fabprint=false" >> "$GITHUB_OUTPUT"

  cloud-bridge:
    needs: detect-changes
    if: needs.detect-changes.outputs.bridge == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cloud-bridge
          platforms: linux/amd64
          push: true
          tags: fabprint/cloud-bridge:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Rebuild orca-base only when explicitly requested via workflow_dispatch.
  # These images are immutable per OrcaSlicer version to ensure reproducible builds.
  orca-base:
    if: github.event_name == 'workflow_dispatch' && inputs.rebuild-base
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        orca-version: ["2.3.1", "2.3.2"]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.orca-base
          platforms: linux/amd64
          push: true
          tags: |
            fabprint/orca-base:${{ matrix.orca-version }}
            ghcr.io/${{ github.repository }}/orca-base:${{ matrix.orca-version }}
          build-args: ORCA_VERSION=${{ matrix.orca-version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Rebuild the fabprint Python layer on push to main or manual dispatch.
  fabprint-images:
    needs: detect-changes
    if: needs.detect-changes.outputs.fabprint == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        orca-version: ["2.3.1", "2.3.2"]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3

      - name: Build and push fabprint image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            fabprint/fabprint:orca-${{ matrix.orca-version }}
            ghcr.io/${{ github.repository }}:orca-${{ matrix.orca-version }}
          build-args: ORCA_VERSION=${{ matrix.orca-version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
