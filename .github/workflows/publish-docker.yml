name: Publish Docker images

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rebuild-base:
        description: "Rebuild orca-base images (normally only on release tags)"
        type: boolean
        default: false
      rebuild-cura-base:
        description: "Rebuild cura-base images"
        type: boolean
        default: false

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      estampo: ${{ steps.check.outputs.estampo }}
      cura: ${{ steps.check.outputs.cura }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Skip if this is a release PR merge
        id: release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '.[0].head.ref' 2>/dev/null || echo "")
          if [[ -z "$BRANCH" ]]; then
            echo "::warning::Could not determine PR branch (API unavailable?) — proceeding"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif [[ "$BRANCH" =~ ^release/v ]]; then
            echo "::notice::Release PR merge — skipping (release.yml handles Docker)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect changed files
        id: check
        if: steps.release.outputs.skip != 'true'
        run: |
          CHANGED=$(git diff HEAD~1 HEAD --name-only)
          echo "$CHANGED" | grep -qE '^Dockerfile$|^src/estampo/|^pyproject\.toml$|^uv\.lock$' \
            && echo "estampo=true" >> "$GITHUB_OUTPUT" || echo "estampo=false" >> "$GITHUB_OUTPUT"
          echo "$CHANGED" | grep -qE '^Dockerfile\.cura|^src/estampo/cura\.py' \
            && echo "cura=true" >> "$GITHUB_OUTPUT" || echo "cura=false" >> "$GITHUB_OUTPUT"

  # Rebuild orca-base only when explicitly requested via workflow_dispatch.
  # These images are immutable per OrcaSlicer version to ensure reproducible builds.
  # Uses no-cache to avoid GHA layer cache returning stale system packages.
  orca-base:
    if: github.event_name == 'workflow_dispatch' && inputs.rebuild-base
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        orca-version: ["2.3.1"]  # 2.3.2 disabled: segfaults on slice (exit 139)
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.orca-base
          platforms: linux/amd64
          push: true
          no-cache: true
          tags: |
            estampo/orca-base:${{ matrix.orca-version }}
            ghcr.io/${{ github.repository }}/orca-base:${{ matrix.orca-version }}
          build-args: ORCA_VERSION=${{ matrix.orca-version }}

  # Rebuild the estampo Python layer on push to main or manual dispatch.
  estampo-images:
    needs: [detect-changes, orca-base]
    if: always() && !failure() && (needs.detect-changes.outputs.estampo == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        orca-version: ["2.3.1"]  # 2.3.2 disabled: segfaults on slice (exit 139)
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4

      - name: Build and push estampo image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            estampo/estampo:orca-${{ matrix.orca-version }}
            ghcr.io/${{ github.repository }}:orca-${{ matrix.orca-version }}
          build-args: |
            ORCA_VERSION=${{ matrix.orca-version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --- CuraEngine images ---

  # Rebuild cura-base only when explicitly requested via workflow_dispatch.
  # These images are immutable per CuraEngine version to ensure reproducible builds.
  cura-base:
    if: github.event_name == 'workflow_dispatch' && inputs.rebuild-cura-base
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        cura-version: ["5.12.0"]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.cura-base
          platforms: linux/amd64
          push: true
          no-cache: true
          tags: |
            estampo/cura-base:${{ matrix.cura-version }}
            ghcr.io/${{ github.repository }}/cura-base:${{ matrix.cura-version }}
          build-args: CURA_VERSION=${{ matrix.cura-version }}

  # Rebuild the CuraEngine estampo layer on relevant changes or manual dispatch.
  cura-images:
    needs: [detect-changes, cura-base]
    if: always() && !failure() && (needs.detect-changes.outputs.cura == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        cura-version: ["5.12.0"]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4

      - name: Build and push estampo CuraEngine image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.cura
          platforms: linux/amd64
          push: true
          tags: |
            estampo/estampo:cura-${{ matrix.cura-version }}
            ghcr.io/${{ github.repository }}:cura-${{ matrix.cura-version }}
          build-args: |
            CURA_VERSION=${{ matrix.cura-version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
